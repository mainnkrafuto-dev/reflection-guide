<style>*{box-sizing:border-box}

#dock{position:absolute;left:50%;top:calc(69% + 6px);bottom:0;transform:translateX(-50%);width:min(100%,710px);padding:7px 8px 9px;background:rgba(9,12,18,.94);backdrop-filter:blur(12px);border-top:1px solid rgba(255,255,255,.12);border-bottom:1px solid rgba(255,255,255,.08);box-shadow:0 -8px 22px rgba(0,0,0,.32);z-index:4}
.toolbar{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-template-rows:repeat(2,auto);gap:5px}.toolbar button,.toolbar label{min-height:34px}

input[type=file]{display:none}
.controls{display:grid;grid-template-columns:1fr 1fr 1fr;gap:5px;margin-top:5px}.control{background:rgba(20,25,34,.94);border:1px solid #252d39;border-radius:8px;padding:5px 7px;font-size:10px;color:#cbd2dc}.control .top{display:flex;justify-content:space-between;gap:5px;margin-bottom:3px}.control b{color:#fff;font-size:11px}.control input{width:100%;margin:0;accent-color:#4db9ff}

</head>
<body>
<header>
  <div class="title"><h1>モンスト反射線ガイド</h1><span class="ver">v27 YOLO11m AI認識</span></div>
</header>

<div id="wrap">
  <canvas id="cv"></canvas>
  <div id="dock">
    <div class="toolbar">
      <label class="btn">📷 読込<input id="file" type="file" accept="image/*"></label>
      <button id="lock" class="primary">① 円を合わせる</button>
      <button id="showWall">壁枠 ON</button>
      <button id="save">💾 保存</button>
      <button id="widthMode">軌道幅 OFF</button>
      <button id="autoMarkerToggle">自動認識丸 OFF</button>
      <button id="autoMarkerSelect">自動丸を選択</button>
      <label class="btn">🤖 AIモデル読込<input id="modelFile" type="file" accept=".onnx,application/octet-stream"></label>
    </div>
    <div class="controls">
      <div class="control control-full">
        <div class="top"><span>円径</span><b><span id="dv">110</span>px</b></div>
        <div class="slider-line"><input id="diam" type="range" min="40" max="160" step="2" value="110"><div class="stepper"><button type="button" id="diamMinus">−</button><button type="button" id="diamPlus">＋</button></div></div>
      </div>
      <div class="control control-full">
        <div class="top"><span>進行方向 反射回数</span><b><span id="bv">4</span>回</b></div>
        <div class="slider-line"><input id="bounces" type="range" min="0" max="20" step="1" value="4"><div class="stepper"><button type="button" id="bounceMinus">−</button><button type="button" id="bouncePlus">＋</button></div></div>
      </div>
      <div class="control control-full">
        <div class="top"><span>逆方向 反射回数</span><b><span id="rv">0</span>回</b></div>
        <div class="slider-line"><input id="reverseBounces" type="range" min="0" max="20" step="1" value="0"><div class="stepper"><button type="button" id="reverseMinus">−</button><button type="button" id="reversePlus">＋</button></div></div>
      </div>
    </div>
  </div>
</div>
<script>
const BASE_W=710, BASE_H=1536;
// 今回の2枚の実測：壁に接触した「六角形中心」を中心座標として固定。
// 左下：左壁≈34, 下壁≈1034 / 右上：右壁≈676, 上壁≈296
const WALL={L:34,R:676,T:296,B:1030};

const cv=document.getElementById('cv'), ctx=cv.getContext('2d');
const file=document.getElementById('file');
const lockBtn=document.getElementById('lock');
const place=document.getElementById('lock');
const showWall=document.getElementById('showWall');
const save=document.getElementById('save');
const widthModeBtn=document.getElementById('widthMode');
const bounces=document.getElementById('bounces');
const reverseBounces=document.getElementById('reverseBounces');
const diam=document.getElementById('diam');
const bv=document.getElementById('bv'),rv=document.getElementById('rv'),dv=document.getElementById('dv'),lv=document.getElementById('lv');

let img=null, W=BASE_W,H=BASE_H;
let sx=1,sy=1;
let ball={x:355,y:700,r:55};
let aim={x:500,y:700};
let pullPoint={x:155,y:700};
// 引っ張り操作用の「擬似キャラ中心」。最初に画面をタップした点を固定し、
// その点を中心に指を動かした角度を、実キャラの発射角として使う。
let aimAnchor={x:155,y:700};
let dragging=null;
let showWalls=true;
let locked=false;
let manualAdjustMode=false;
let touchPreview=null;
let characters=[]; let selectedCharacter=-1;
let showAutoMarkers=true;
let showCorridor=false;
const TOUCH_OFFSET_CSS=126;
function getTouchOffsetY(){
  const r=cv.getBoundingClientRect();
  return TOUCH_OFFSET_CSS*BASE_H/r.height;
}

function fitCanvas(){
  const maxW=Math.min(window.innerWidth-20,BASE_W);
  const ratio=BASE_H/BASE_W;
  cv.style.width=maxW+'px';
  cv.style.height=(maxW*ratio)+'px';
  sx=cv.width/BASE_W; sy=cv.height/BASE_H;
}

function resizeCanvas(){
  cv.width=BASE_W; cv.height=BASE_H; fitCanvas(); draw();
}
window.addEventListener('resize',fitCanvas);

function draw(){
  ctx.clearRect(0,0,W,H);
  if(img){
    ctx.drawImage(img,0,0,W,H);
  }else{
    ctx.fillStyle='#251f1b';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#777';ctx.font='24px sans-serif';ctx.textAlign='center';
    ctx.fillText('スクリーンショットを読み込んでください',W/2,H/2);
  }

  if(showWalls){
    ctx.save();
    ctx.strokeStyle='rgba(0,220,255,.9)';
    ctx.lineWidth=3;
    ctx.setLineDash([12,8]);
    ctx.strokeRect(WALL.L,WALL.T,WALL.R-WALL.L,WALL.B-WALL.T);
    ctx.setLineDash([]);
    ctx.fillStyle='rgba(0,220,255,.95)';
    ctx.font='bold 18px sans-serif';
    ctx.textAlign='left';
    ctx.fillText('固定壁',WALL.L+8,WALL.T-10);
    ctx.restore();
  }

  if(showAutoMarkers && characters.length){characters.forEach((c,i)=>{ctx.save();ctx.strokeStyle=i===selectedCharacter?'#fff36a':'#46dfff';ctx.lineWidth=3;ctx.beginPath();ctx.arc(c.x,c.y,ball.r,0,Math.PI*2);ctx.stroke();ctx.fillStyle='#fff';ctx.font='bold 20px sans-serif';ctx.textAlign='center';ctx.fillText(c.label,c.x,c.y-ball.r-9);ctx.restore();});}
  if(locked) drawGuide();
  if(!locked && (!characters.length || selectedCharacter>=0 || manualAdjustMode)) drawPlacementUI();
}

function drawPlacementUI(){
  ctx.save();
  ctx.strokeStyle=manualAdjustMode?'#ffb84d':'#ff315d'; ctx.lineWidth=4;
  ctx.fillStyle=manualAdjustMode?'rgba(255,184,77,.13)':'rgba(255,49,93,.10)';
  ctx.beginPath(); ctx.arc(ball.x,ball.y,ball.r,0,Math.PI*2); ctx.fill(); ctx.stroke();
  ctx.fillStyle=manualAdjustMode?'#ffb84d':'#ff315d';
  ctx.beginPath(); ctx.arc(ball.x,ball.y,4,0,Math.PI*2); ctx.fill();

  if(touchPreview){
    ctx.strokeStyle='rgba(255,255,255,.75)';
    ctx.lineWidth=2; ctx.setLineDash([5,5]);
    ctx.beginPath(); ctx.moveTo(touchPreview.x,touchPreview.y); ctx.lineTo(ball.x,ball.y); ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle='rgba(255,255,255,.9)';
    ctx.beginPath(); ctx.arc(touchPreview.x,touchPreview.y,6,0,Math.PI*2); ctx.fill();
  }
  ctx.restore();
}

function drawGuide(){
  // 固定後は画面のどこからでも指を置いて引っ張れる。
  // 指の位置（pullPoint）を基準に、反対方向を進行方向にする。
  const rawDx=aim.x-ball.x, rawDy=aim.y-ball.y;
  const rawD=Math.hypot(rawDx,rawDy)||1;
  const ux=rawDx/rawD, uy=rawDy/rawD;
  // 軌道
  const bounceCount=Number(bounces.value);
  const autoLen=Math.max(3000,2500*(bounceCount+1));
  const p=trace(ball.x,ball.y,aim.x,aim.y,bounceCount,autoLen);
  ctx.save();
  if(showCorridor){ctx.strokeStyle='rgba(255,70,70,.18)';ctx.lineWidth=Math.max(20,ball.r*2);ctx.lineCap='round';ctx.beginPath();ctx.moveTo(p[0].x,p[0].y);for(let i=1;i<p.length;i++)ctx.lineTo(p[i].x,p[i].y);ctx.stroke();}
  ctx.strokeStyle='rgba(255,70,70,.95)';
  ctx.lineWidth=5;
  ctx.lineCap='round';
  ctx.shadowColor='rgba(0,0,0,.7)';
  ctx.shadowBlur=4;
  ctx.beginPath();
  ctx.moveTo(p[0].x,p[0].y);
  for(let i=1;i<p.length;i++)ctx.lineTo(p[i].x,p[i].y);
  ctx.stroke();
  ctx.restore();

  // 最初の壁を越えた先を約1cmだけ点線で延長（反射線とは別の補助表示）
  const firstRed=firstWallHit(ball.x,ball.y,ux,uy);
  if(firstRed){ drawBeyondWall(firstRed.x,firstRed.y,ux,uy,'#ff4646'); }

  // 反射点
  ctx.fillStyle='#fff';
  for(let i=1;i<p.length-1;i++){
    ctx.beginPath();ctx.arc(p[i].x,p[i].y,5,0,Math.PI*2);ctx.fill();
  }

  // キャラ円
  ctx.save();
  ctx.strokeStyle='#ff315d';ctx.lineWidth=4;
  ctx.fillStyle='rgba(255,49,93,.10)';
  ctx.beginPath();ctx.arc(ball.x,ball.y,ball.r,0,Math.PI*2);ctx.fill();ctx.stroke();
  ctx.fillStyle='#ff315d';
  ctx.beginPath();ctx.arc(ball.x,ball.y,4,0,Math.PI*2);ctx.fill();
  ctx.restore();

  // モンスト式の感覚：最初にタップした「擬似キャラ中心」を固定し、
  // そこから指を引っ張った方向の逆を進行方向にする。
  // 逆方向：常に黄色。反射回数0なら従来通り「最初の壁まで」。
  // 1以上なら壁で反射しながら黄色い軌道を伸ばす。
  const reverseCount=Number(reverseBounces.value);
  const back=firstWallHit(ball.x,ball.y,-ux,-uy);
  if(reverseCount===0){
    if(back){
      ctx.save();
      ctx.strokeStyle='#ffe45c';ctx.lineWidth=4;ctx.lineCap='round';
      ctx.beginPath();ctx.moveTo(ball.x,ball.y);ctx.lineTo(back.x,back.y);ctx.stroke();
      ctx.restore();
      drawBeyondWall(back.x,back.y,-ux,-uy,'#ffe45c');
    }
  }else{
    // 黄色線の最初の区間は反射計算に依存させず、必ずキャラ中心から最初の壁まで描く。
    // これにより反射回数や角度によって「反射前の線」まで消える問題を防ぐ。
    ctx.save();
    ctx.strokeStyle='#ffe45c';ctx.lineWidth=4;ctx.lineCap='round';
    ctx.shadowColor='rgba(0,0,0,.7)';ctx.shadowBlur=4;
    ctx.beginPath();ctx.moveTo(ball.x,ball.y);
    if(back){ctx.lineTo(back.x,back.y);}else{ctx.lineTo(ball.x-ux*1000,ball.y-uy*1000);}
    ctx.stroke();ctx.restore();

    if(back){
      drawBeyondWall(back.x,back.y,-ux,-uy,'#ffe45c');
      // 最初の壁に到達した後の軌道だけを別計算。反射回数1なら次の壁までを描く。
      const reverseAutoLen=Math.max(3000,2500*reverseCount);
      const rp=trace(back.x,back.y,back.x-ux,back.y-uy,reverseCount-1,reverseAutoLen);
      ctx.save();
      ctx.strokeStyle='#ffe45c';ctx.lineWidth=4;ctx.lineCap='round';
      ctx.shadowColor='rgba(0,0,0,.7)';ctx.shadowBlur=4;
      ctx.beginPath();ctx.moveTo(rp[0].x,rp[0].y);
      for(let i=1;i<rp.length;i++)ctx.lineTo(rp[i].x,rp[i].y);
      ctx.stroke();ctx.restore();
      ctx.fillStyle='#fff';
      for(let i=1;i<rp.length-1;i++){
        ctx.beginPath();ctx.arc(rp[i].x,rp[i].y,5,0,Math.PI*2);ctx.fill();
      }
    }
  }
  // 赤線を最後に再描画し、黄色線と重なった区間でも赤線を前面に保つ。
  ctx.save();ctx.strokeStyle='rgba(255,70,70,.98)';ctx.lineWidth=5;ctx.lineCap='round';ctx.shadowColor='rgba(0,0,0,.7)';ctx.shadowBlur=4;
  ctx.beginPath();ctx.moveTo(p[0].x,p[0].y);for(let i=1;i<p.length;i++)ctx.lineTo(p[i].x,p[i].y);ctx.stroke();ctx.restore();
}

function drawBeyondWall(x,y,dx,dy,color){
  // 最初の直線だけ壁の外へ点線延長。
  // 左右壁は画面端まで、上下壁は約2cm（基準座標で100px）。
  const hitLeft = Math.abs(x-WALL.L)<1e-4;
  const hitRight = Math.abs(x-WALL.R)<1e-4;

  let ex,ey;
  if(hitLeft || hitRight){
    const t = dx>1e-9 ? (W-x)/dx : (dx<-1e-9 ? (0-x)/dx : 0);
    if(t<=0)return;
    ex=x+dx*t;
    ey=y+dy*t;
  }else{
    const twoCm=100;
    ex=x+dx*twoCm;
    ey=y+dy*twoCm;
  }

  ctx.save();
  ctx.strokeStyle=color;
  ctx.lineWidth=3;
  ctx.lineCap='round';
  ctx.setLineDash([7,8]);
  ctx.beginPath();
  ctx.moveTo(x,y);
  ctx.lineTo(ex,ey);
  ctx.stroke();
  ctx.setLineDash([]);
  ctx.restore();
}
function firstWallHit(x,y,dx,dy){
  const hits=[];
  if(dx>1e-9) hits.push((WALL.R-x)/dx);
  if(dx<-1e-9) hits.push((WALL.L-x)/dx);
  if(dy>1e-9) hits.push((WALL.B-y)/dy);
  if(dy<-1e-9) hits.push((WALL.T-y)/dy);
  const t=Math.min(...hits.filter(v=>v>1e-7));
  if(!isFinite(t)) return null;
  return {x:x+dx*t,y:y+dy*t};
}

function trace(x,y,ax,ay,n,maxLen){
  // 壁境界から始まるケースも安定して扱う反射計算。
  let dx=ax-x, dy=ay-y, d=Math.hypot(dx,dy);
  if(d<1e-9) return [{x,y}];
  dx/=d; dy/=d;
  let px=x, py=y, remain=Math.max(0,maxLen);
  const pts=[{x:px,y:py}], EPS=1e-6;
  const reflections=Math.max(0,Math.floor(n));
  let hits=0, guard=0;
  while(remain>EPS && guard++<100){
    // 始点が壁上で外向きなら、線分を進める前に内向きへ反転。
    if(px<=WALL.L+EPS && dx<0) dx=-dx;
    if(px>=WALL.R-EPS && dx>0) dx=-dx;
    if(py<=WALL.T+EPS && dy<0) dy=-dy;
    if(py>=WALL.B-EPS && dy>0) dy=-dy;

    let tx=Infinity, ty=Infinity;
    if(dx>EPS) tx=(WALL.R-px)/dx; else if(dx<-EPS) tx=(WALL.L-px)/dx;
    if(dy>EPS) ty=(WALL.B-py)/dy; else if(dy<-EPS) ty=(WALL.T-py)/dy;
    if(tx<EPS) tx=Infinity; if(ty<EPS) ty=Infinity;
    let t=Math.min(tx,ty), hitX=Math.abs(t-tx)<1e-4, hitY=Math.abs(t-ty)<1e-4;
    if(!Number.isFinite(t)) break;
    if(t>=remain){pts.push({x:px+dx*remain,y:py+dy*remain});break;}
    px+=dx*t; py+=dy*t; remain-=t;
    if(hitX)px=dx>0?WALL.R:WALL.L;if(hitY)py=dy>0?WALL.B:WALL.T;
    pts.push({x:px,y:py});
    if(hitX)dx=-dx;if(hitY)dy=-dy;
    hits++;
    if(hits>reflections) break;
  }
  return pts;
}

function posFromEvent(e){
  const r=cv.getBoundingClientRect();
  return {x:(e.clientX-r.left)*BASE_W/r.width,y:(e.clientY-r.top)*BASE_H/r.height};
}
function down(e){
  e.preventDefault();
  const p=posFromEvent(e);
  const d=Math.hypot(p.x-ball.x,p.y-ball.y);
  // 位置固定後は画面のどこからでも操作可能。
  // 最初にタップした点を「擬似的なキャラクター中心」として固定し、
  // そこを基準に指を360°動かして角度を決める。
  if(characters.length && !locked && !manualAdjustMode){
    let best=-1,bd=Infinity;characters.forEach((c,i)=>{const d=Math.hypot(p.x-c.x,p.y-c.y);if(d<bd){bd=d;best=i;}});
    if(best>=0 && bd<=Math.max(70,ball.r+15)){selectedCharacter=best;ball.x=characters[best].x;ball.y=characters[best].y;locked=true;manualAdjustMode=false;aim.x=ball.x+200;aim.y=ball.y;pullPoint.x=ball.x-200;pullPoint.y=ball.y;lockBtn.textContent='位置固定中';lockBtn.classList.add('locked');draw();return;}
    dragging='ball';
  }
  else if(locked){
    dragging='aim';
    aimAnchor.x=p.x;
    aimAnchor.y=p.y;
    pullPoint.x=p.x;
    pullPoint.y=p.y;
    // 初期タップ位置とキャラ中心を結ぶ方向を暫定角度にする。
    let dx=aimAnchor.x-p.x,dy=aimAnchor.y-p.y;
    if(Math.hypot(dx,dy)<1){
      dx=ball.x-p.x; dy=ball.y-p.y;
    }
    aim.x=ball.x+dx;
    aim.y=ball.y+dy;
  }else if(d<=ball.r+25){
    dragging='ball';
  }else{
    dragging='ball';
  }
  cv.setPointerCapture?.(e.pointerId);
  move(e);
}
function move(e){
  if(!dragging)return;
  e.preventDefault();
  const p=posFromEvent(e);
  if(dragging==='ball'){
    // キャラクター中心は壁の内側ならどこでも置ける。円の半径分まで内側へ制限しない。
    ball.x=Math.max(WALL.L,Math.min(WALL.R,p.x));
    ball.y=Math.max(WALL.T,Math.min(WALL.B,p.y-getTouchOffsetY()));
    // 手動位置はballだけを更新。自動認識結果charactersは保持して動かさない。
    // 発射方向も同じベクトルを維持
    const dx=aim.x-ball.x,dy=aim.y-ball.y;
    if(Math.hypot(dx,dy)<5){aim.x=ball.x+100;aim.y=ball.y}
  }else{
    // 最初のタップ位置（擬似キャラ中心）から見た現在の指位置を使う。
    // 指を中心から外へ引っ張った方向の逆が進行方向。
    const dx=aimAnchor.x-p.x;
    const dy=aimAnchor.y-p.y;
    if(Math.hypot(dx,dy)>1){
      // モンスト本家に合わせて0.35度単位へスナップ
      const angle=Math.atan2(dy,dx), step=0.35*Math.PI/180;
      const snapped=Math.round(angle/step)*step;
      const len=Math.hypot(dx,dy);
      aim.x=ball.x+Math.cos(snapped)*len;
      aim.y=ball.y+Math.sin(snapped)*len;
    }
    pullPoint.x=p.x;
    pullPoint.y=p.y;
  }
  draw();
}
function up(){dragging=null;draw()}

function clampSlider(el,value){
  const min=Number(el.min),max=Number(el.max),step=Number(el.step)||1;
  let v=Math.max(min,Math.min(max,value));
  v=Math.round((v-min)/step)*step+min;
  v=Math.max(min,Math.min(max,v));
  el.value=v;
  el.dispatchEvent(new Event('input',{bubbles:true}));
}
function wireStep(idMinus,idPlus,el,step){
  document.getElementById(idMinus).onclick=()=>clampSlider(el,Number(el.value)-step);
  document.getElementById(idPlus).onclick=()=>clampSlider(el,Number(el.value)+step);
}

 for(let i=0;i<gray.length;i++){const k=i*4;gray[i]=(0.299*d[k]+0.587*d[k+1]+0.114*d[k+2])|0;}
 // Sobel edge magnitude: shape-only, no RGB hue or red-pixel dependency.
 for(let y=1;y<h-1;y++)for(let x=1;x<w-1;x++){const i=y*w+x;
  const gx=-gray[i-w-1]+gray[i-w+1]-2*gray[i-1]+2*gray[i+1]-gray[i+w-1]+gray[i+w+1];
  const gy=-gray[i-w-1]-2*gray[i-w]-gray[i-w+1]+gray[i+w-1]+2*gray[i+w]+gray[i+w+1];
  if(Math.abs(gx)+Math.abs(gy)>150)mask[i]=1;
 }
 return {mask,w,h};
}
function sampleTemplate(mask,w,h,gw,gh){
 const out=new Uint8Array(gw*gh);for(let y=0;y<gh;y++)for(let x=0;x<gw;x++){const sx=Math.min(w-1,Math.round(x*(w-1)/(gw-1))),sy=Math.min(h-1,Math.round(y*(h-1)/(gh-1)));out[y*gw+x]=mask[sy*w+sx];}
 let mean=0;for(const v of out)mean+=v;mean/=out.length;let variance=0;for(const v of out)variance+=(v-mean)*(v-mean);
 return {mask:out,mean,std:Math.sqrt(variance/out.length),w,h,gw,gh};
}
function matchAt(target,t,x,y,w,h){
 let sum=0,sum2=0,cross=0;const n=t.gw*t.gh;
 for(let gy=0;gy<t.gh;gy++){const yy=y+Math.round(gy*(h-1)/(t.gh-1));if(yy<0||yy>=BASE_H)return -1;
  for(let gx=0;gx<t.gw;gx++){const xx=x+Math.round(gx*(w-1)/(t.gw-1));if(xx<0||xx>=BASE_W)return -1;const v=target[yy*BASE_W+xx],q=t.mask[gy*t.gw+gx];sum+=v;sum2+=v*v;cross+=v*q;}}
 const mv=sum/n,varV=Math.max(1e-6,sum2/n-mv*mv),varT=Math.max(1e-6,t.std*t.std);
 return (cross/n-mv*t.mean)/Math.sqrt(varV*varT);
}
async function detectRankCandidates(templates){
 if(!img)return [];
 const c=document.createElement('canvas');c.width=BASE_W;c.height=BASE_H;const g=c.getContext('2d',{willReadFrequently:true});g.drawImage(img,0,0,BASE_W,BASE_H);
 // Build the screenshot edge map at the guide's 710x1536 working resolution.
 const d=g.getImageData(0,0,BASE_W,BASE_H).data,gray=new Uint8Array(BASE_W*BASE_H),edge=new Uint8Array(BASE_W*BASE_H);
 for(let i=0;i<gray.length;i++){const k=i*4;gray[i]=(0.299*d[k]+0.587*d[k+1]+0.114*d[k+2])|0;}
 for(let y=1;y<BASE_H-1;y++)for(let x=1;x<BASE_W-1;x++){const i=y*BASE_W+x;
  const gx=-gray[i-BASE_W-1]+gray[i-BASE_W+1]-2*gray[i-1]+2*gray[i+1]-gray[i+BASE_W-1]+gray[i+BASE_W+1];
  const gy=-gray[i-BASE_W-1]-2*gray[i-BASE_W]-gray[i-BASE_W+1]+gray[i+BASE_W-1]+2*gray[i+BASE_W]+gray[i+BASE_W+1];
  if(Math.abs(gx)+Math.abs(gy)>150)edge[i]=1;
 }
 const results=[];
 for(const label of RANK_LABELS){
  const raw=templates[label],coarse=sampleTemplate(raw.mask,raw.w,raw.h,16,10),fine=sampleTemplate(raw.mask,raw.w,raw.h,24,16);
  const nominalW=Math.round(raw.w),nominalH=Math.round(raw.h),widths=[nominalW-2,nominalW,nominalW+2],seeds=[];
  // Full gameplay-area scan. No wall coordinates and no fixed character slots.
  for(const ww of widths){const hh=Math.round(ww*nominalH/nominalW);
   for(let y=180;y<=Math.min(1140,BASE_H-hh);y+=4){
    for(let x=0;x<=BASE_W-ww;x+=4){const score=matchAt(edge,coarse,x,y,ww,hh);if(score<0.22)continue;
     let near=seeds.find(z=>Math.hypot(z.x-x,z.y-y)<12);
     if(near){if(score>near.score)Object.assign(near,{x,y,w:ww,h:hh,score});}
     else{seeds.push({x,y,w:ww,h:hh,score});seeds.sort((a,b)=>b.score-a.score);if(seeds.length>12)seeds.pop();}
    }
    if(y%80===0){setStatus('順位表示を輪郭照合中… '+label);await new Promise(resolve=>requestAnimationFrame(resolve));}
   }
  }
  let best={score:-1};
  for(const seed of seeds){for(const dw of [-1,0,1]){const ww=seed.w+dw,hh=Math.round(ww*nominalH/nominalW);
   for(let y=Math.max(180,seed.y-4);y<=Math.min(1140-hh,seed.y+4);y++)for(let x=Math.max(0,seed.x-4);x<=Math.min(BASE_W-ww,seed.x+4);x++){
    const score=matchAt(edge,fine,x,y,ww,hh);if(score>best.score)best={score,x,y,w:ww,h:hh};
   }
  }}
  if(best.score>=0.22)results.push({label,x:best.x+best.w/2,y:best.y+best.h/2+42,score:best.score,box:{x:best.x,y:best.y,w:best.w,h:best.h}});
 }
 results.sort((a,b)=>RANK_LABELS.indexOf(a.label)-RANK_LABELS.indexOf(b.label));return results;
}

// v27: YOLO11m ONNX inference. The model file is selected once and cached in IndexedDB.
const MODEL_SIZE=1280;
const MODEL_LABELS=['1st','2nd','3rd','4th'];
const modelFileInput=document.getElementById('modelFile');
let rankSession=null, rankBackend='未読込', rankModelName='', rankModelBytes=null;
function openRankModelDB(){
 return new Promise((resolve,reject)=>{
  if(!('indexedDB' in window)){reject(new Error('IndexedDBを利用できません'));return;}
  const req=indexedDB.open('MonstRankDetector',1);
  req.onupgradeneeded=()=>{if(!req.result.objectStoreNames.contains('models'))req.result.createObjectStore('models');};
  req.onsuccess=()=>resolve(req.result);
  req.onerror=()=>reject(req.error||new Error('モデル保存領域を開けません'));
 });
}
async function saveRankModelBytes(buffer,name){
 const db=await openRankModelDB();
 await new Promise((resolve,reject)=>{
  const tx=db.transaction('models','readwrite');
  tx.objectStore('models').put({buffer,name},'active');
  tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error||new Error('モデル保存に失敗'));
 });
 db.close();
}
async function readSavedRankModel(){
 const db=await openRankModelDB();
 const value=await new Promise((resolve,reject)=>{
  const tx=db.transaction('models','readonly');
  const req=tx.objectStore('models').get('active');
  req.onsuccess=()=>resolve(req.result||null);
  req.onerror=()=>reject(req.error);
 });
 db.close();return value;
}
async function createRankSession(bytes){
 if(!window.ort)throw new Error('推論エンジンを読み込めません。通信環境を確認してください');
 ort.env.wasm.wasmPaths='https://cdn.jsdelivr.net/npm/onnxruntime-web@1.23.2/dist/';
 ort.env.wasm.numThreads=1;
 ort.env.wasm.proxy=false;
 ort.env.logLevel='error';
 const modelBytes=bytes instanceof Uint8Array?bytes:new Uint8Array(bytes);
 let session,backend;
 try{
  session=await ort.InferenceSession.create(modelBytes,{executionProviders:['webgpu'],graphOptimizationLevel:'all'});
  backend='WebGPU';
 }catch(webgpuError){
  console.warn('WebGPUを利用できないためWASMへ切替',webgpuError);
  session=await ort.InferenceSession.create(modelBytes,{executionProviders:['wasm'],graphOptimizationLevel:'all'});
  backend='WASM';
 }
 rankSession=session;rankBackend=backend;
 return session;
}
async function activateRankModel(buffer,name,save=true){
 setStatus('AIモデルを読み込み中…（約81MB）');
 rankModelBytes=buffer instanceof Uint8Array?buffer.slice():new Uint8Array(buffer.slice(0));
 await createRankSession(rankModelBytes);
 rankModelName=name||'best.onnx';
 if(save){
  try{await saveRankModelBytes(buffer,rankModelName);setStatus('AIモデルを読み込みました。次回から自動で復元します');}
  catch(e){setStatus('AIモデル読込済み（この端末への保存はできませんでした）');}
 }else setStatus('保存済みAIモデルを復元しました');
 if(img)await autoRecognize();
}
modelFileInput.addEventListener('change',async e=>{
 const f=e.target.files&&e.target.files[0];if(!f)return;
 try{const bytes=await f.arrayBuffer();await activateRankModel(bytes,f.name,true);}
 catch(err){console.error(err);setStatus('AIモデル読込失敗：'+(err?.message||err));alert('AIモデルを読み込めませんでした。best.onnxを選択してください。');}
 modelFileInput.value='';
});
async function restoreSavedRankModel(){
 try{
  const saved=await readSavedRankModel();
  if(saved?.buffer){
   await activateRankModel(saved.buffer,saved.name||'best.onnx',false);
  }else{
   setStatus('AIモデル未読込。🤖 AIモデル読込からbest.onnxを選択してください');
  }
 }catch(e){console.info('保存済みモデルなし',e);setStatus('AIモデル未読込。🤖 AIモデル読込からbest.onnxを選択してください');}
}
function boxIoU(a,b){
 const x1=Math.max(a.x1,b.x1),y1=Math.max(a.y1,b.y1),x2=Math.min(a.x2,b.x2),y2=Math.min(a.y2,b.y2);
 const inter=Math.max(0,x2-x1)*Math.max(0,y2-y1);
 const aa=Math.max(0,a.x2-a.x1)*Math.max(0,a.y2-a.y1),bb=Math.max(0,b.x2-b.x1)*Math.max(0,b.y2-b.y1);
 return inter/Math.max(1e-9,aa+bb-inter);
}
function letterboxImage(source){
 const sw=source.naturalWidth||source.width,sh=source.naturalHeight||source.height;
 const scale=Math.min(MODEL_SIZE/sw,MODEL_SIZE/sh);
 const nw=Math.round(sw*scale),nh=Math.round(sh*scale);
 const px=Math.floor((MODEL_SIZE-nw)/2),py=Math.floor((MODEL_SIZE-nh)/2);
 const c=document.createElement('canvas');c.width=MODEL_SIZE;c.height=MODEL_SIZE;
 const g=c.getContext('2d',{willReadFrequently:true});
 g.fillStyle='rgb(114,114,114)';g.fillRect(0,0,MODEL_SIZE,MODEL_SIZE);
 g.imageSmoothingEnabled=true;g.imageSmoothingQuality='high';
 g.drawImage(source,px,py,nw,nh);
 return {canvas:c,scale,padX:px,padY:py,sourceW:sw,sourceH:sh};
}
async function detectWithRankModel(){
 if(!rankSession||!img)return [];
 setStatus('AI認識中…');
 const prep=letterboxImage(img);
 const pixels=prep.canvas.getContext('2d',{willReadFrequently:true}).getImageData(0,0,MODEL_SIZE,MODEL_SIZE).data;
 const plane=MODEL_SIZE*MODEL_SIZE;
 const inputData=new Float32Array(plane*3);
 for(let i=0;i<plane;i++){
  const j=i*4;
  inputData[i]=pixels[j]/255;
  inputData[plane+i]=pixels[j+1]/255;
  inputData[plane*2+i]=pixels[j+2]/255;
 }
 const inputName=rankSession.inputNames[0],outputName=rankSession.outputNames[0];
 const tensor=new ort.Tensor('float32',inputData,[1,3,MODEL_SIZE,MODEL_SIZE]);
 const result=await rankSession.run({[inputName]:tensor});
 const out=result[outputName],dims=out.dims,data=out.data;
 if(!dims||dims.length!==3)throw new Error('予期しない出力形状：'+JSON.stringify(dims));
 let channels,anchors,channelMajor;
 if(dims[1]===8){channels=8;anchors=dims[2];channelMajor=true;}
 else if(dims[2]===8){channels=8;anchors=dims[1];channelMajor=false;}
 else throw new Error('出力が8要素/候補ではありません：'+JSON.stringify(dims));
 const value=(ch,i)=>channelMajor?data[ch*anchors+i]:data[i*channels+ch];
 const perClass=[[],[],[],[]],threshold=0.12;
 for(let i=0;i<anchors;i++){
  let cls=0,score=-Infinity;
  for(let c=0;c<4;c++){const v=value(4+c,i);if(v>score){score=v;cls=c;}}
  if(score<threshold)continue;
  const cx=value(0,i),cy=value(1,i),bw=value(2,i),bh=value(3,i);
  if(!Number.isFinite(cx+cy+bw+bh)||bw<=0||bh<=0)continue;
  let x1=(cx-bw/2-prep.padX)/prep.scale;
  let y1=(cy-bh/2-prep.padY)/prep.scale;
  let x2=(cx+bw/2-prep.padX)/prep.scale;
  let y2=(cy+bh/2-prep.padY)/prep.scale;
  x1=Math.max(0,Math.min(prep.sourceW,x1));x2=Math.max(0,Math.min(prep.sourceW,x2));
  y1=Math.max(0,Math.min(prep.sourceH,y1));y2=Math.max(0,Math.min(prep.sourceH,y2));
  if(x2<=x1||y2<=y1)continue;
  perClass[cls].push({x1,y1,x2,y2,score});
 }
 const found=[];
 for(let cls=0;cls<4;cls++){
  const candidates=perClass[cls].sort((a,b)=>b.score-a.score),kept=[];
  for(const cand of candidates){
   if(kept.every(k=>boxIoU(k,cand)<0.45))kept.push(cand);
   if(kept.length>=5)break;
  }
  if(!kept.length)continue;
  const b=kept[0],cx=(b.x1+b.x2)/2,cy=(b.y1+b.y2)/2;
  // Training labels mark the rank badge; convert its center to the monster center
  // using the previously calibrated +42px offset in the 710x1536 guide coordinate system.
  const gx=cx*BASE_W/prep.sourceW;
  const gy=cy*BASE_H/prep.sourceH+42;
  found.push({label:MODEL_LABELS[cls],x:gx,y:gy,score:b.score,box:{x:b.x1,y:b.y1,w:b.x2-b.x1,h:b.y2-b.y1}});
 }
 return found;
}
async function autoRecognize(){
 characters=[];selectedCharacter=-1;locked=false;manualAdjustMode=false;
 if(rankSession){
  try{characters=await detectWithRankModel();}
  catch(e){
   console.warn('YOLO11m推論エラー',e);
   if(rankBackend==='WebGPU'&&rankModelBytes){
    try{
     setStatus('WebGPUで実行できなかったため、WASMへ切り替え中…');
     rankSession=await ort.InferenceSession.create(rankModelBytes,{executionProviders:['wasm'],graphOptimizationLevel:'all'});
     rankBackend='WASM';
     characters=await detectWithRankModel();
    }catch(fallbackError){
     console.error('WASM推論も失敗',fallbackError);
     draw();setStatus('AI推論エラー：'+(fallbackError?.message||fallbackError)+'。手動調整を利用してください');return;
    }
   }else{
    draw();setStatus('AI推論エラー：'+(e?.message||e)+'。手動調整を利用してください');return;
   }
  }
  draw();
  const missing=MODEL_LABELS.filter(k=>!characters.some(c=>c.label===k));
  const details=characters.map(c=>c.label+' '+Math.round(c.score*100)+'%').join(' / ');
  if(missing.length)setStatus('AI認識 '+characters.length+'/4体。未検出：'+missing.join('・')+'。'+details+'。手動調整も利用できます');
  else setStatus('AI認識 4/4体：'+details+'。使いたいキャラクターをタップしてください');
  return;
 }
 // AIモデル未読込時は従来の輪郭照合を暫定利用
 try{const templates={};for(const [label,data] of Object.entries(RANK_TEMPLATE_DATA)){const im=await loadRankImage(data);templates[label]=makeEdgeMask(im);}characters=await detectRankCandidates(templates);}
 catch(e){console.error('順位表示エッジ照合エラー',e);}
 draw();
 const missing=RANK_LABELS.filter(k=>!characters.some(c=>c.label===k));
 if(missing.length)setStatus('AIモデル未読込。暫定輪郭照合 '+characters.length+'/4体。🤖 AIモデル読込からbest.onnxを選択してください');
 else setStatus('AIモデル未読込。暫定輪郭照合で候補を表示中。🤖 AIモデル読込からbest.onnxを選択してください');
}

function setStatus(message){let s=document.getElementById('status');if(!s){s=document.createElement('div');s.id='status';s.className='status';document.querySelector('#dock').appendChild(s);}s.textContent=message;}
resizeCanvas();
restoreSavedRankModel();
</script>
