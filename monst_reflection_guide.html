<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>モンスト反射ガイド</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;background:#111;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif}
body{padding:10px}
h1{font-size:20px;margin:4px 0 8px}
.bar{display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
button,.file{border:0;border-radius:10px;background:#292929;color:#fff;padding:10px 12px;font-weight:700}
button:active,.file:active{opacity:.7}
input[type=file]{display:none}
label.file{display:inline-block}
.small{font-size:12px;color:#aaa}
#wrap{position:relative;width:100%;max-width:900px;margin:auto;touch-action:none}
canvas{display:block;width:100%;height:auto;background:#222;border-radius:12px;touch-action:none}
#empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;color:#aaa;pointer-events:none;padding:30px}
.controls{max-width:900px;margin:8px auto}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row span{font-size:13px}
input[type=range]{flex:1;min-width:180px}
.badge{padding:5px 8px;background:#202020;border-radius:8px;font-variant-numeric:tabular-nums}
.help{background:#181818;border-radius:10px;padding:10px;font-size:12px;color:#bbb;line-height:1.55;margin-top:8px}
</style>
</head>
<body>
<h1>🎯 モンスト反射ガイド</h1>
<div class="bar">
<label class="file">📷 スクショを読み込む<input id="file" type="file" accept="image/*"></label>
<button id="clear">リセット</button>
<button id="undo">↩︎ 障害物を1個戻す</button>
</div>
<div id="wrap">
<canvas id="c"></canvas>
<div id="empty">スクショを読み込んでね<br>読み込み後、キャラ位置をタップして発射点を置けます</div>
</div>
<div class="controls">
<div class="row">
<span>反射回数</span><span class="badge" id="bounces">8</span>
<input id="bounce" type="range" min="1" max="30" value="8">
</div>
<div class="row" style="margin-top:7px">
<span>角度</span><span class="badge" id="angle">0°</span>
<input id="ang" type="range" min="-180" max="180" value="0">
</div>
<div class="help">
<b>使い方</b><br>
① スクショを読み込む → ② キャラをタップ → ③ 画面を指で左右に動かして角度調整。<br>
<strong>障害物を追加：</strong>「障害物追加」モードでは、画面を2回タップして四角形を作成できます。<br>
※この版は壁・矩形ブロックの幾何学的な反射を計算します。敵・キャラの当たり判定、弱点判定、アイテム等は自動認識しません。
</div>
<div class="bar" style="margin-top:8px">
<button id="mode">🧱 障害物追加OFF</button>
<button id="save">📸 ガイド画像を保存</button>
</div>
</div>

<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
const file=document.getElementById('file'),empty=document.getElementById('empty');
const bounce=document.getElementById('bounce'),ang=document.getElementById('ang');
const bb=document.getElementById('bounces'),aa=document.getElementById('angle');
let img=null, W=900,H=700, start=null, angle=0, blocks=[], adding=false, first=null;

function resizeCanvas(i){
  const max=1200, s=Math.min(1,max/i.width);
  W=Math.round(i.width*s); H=Math.round(i.height*s);
  c.width=W;c.height=H; draw();
}
file.onchange=e=>{
 const f=e.target.files[0]; if(!f)return;
 const r=new FileReader();
 r.onload=()=>{img=new Image();img.onload=()=>{resizeCanvas(img);empty.style.display='none';start=null;blocks=[]};img.src=r.result};
 r.readAsDataURL(f);
};
function pos(e){
 const r=c.getBoundingClientRect();
 const p=e.touches?e.touches[0]:e;
 return {x:(p.clientX-r.left)*W/r.width,y:(p.clientY-r.top)*H/r.height};
}
function draw(){
 ctx.clearRect(0,0,W,H);
 if(img)ctx.drawImage(img,0,0,W,H); else {ctx.fillStyle='#222';ctx.fillRect(0,0,W,H)}
 ctx.save();
 blocks.forEach(b=>{ctx.fillStyle='rgba(0,180,255,.25)';ctx.strokeStyle='#00bfff';ctx.lineWidth=3;ctx.fillRect(b.x,b.y,b.w,b.h);ctx.strokeRect(b.x,b.y,b.w,b.h)});
 if(start){
   const pts=trace(start,angle*Math.PI/180,Number(bounce.value));
   ctx.strokeStyle='#ff315a';ctx.lineWidth=Math.max(2,W/450);ctx.beginPath();
   pts.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));ctx.stroke();
   ctx.fillStyle='#ff315a';ctx.beginPath();ctx.arc(start.x,start.y,Math.max(6,W/80),0,Math.PI*2);ctx.fill();
   const end=pts[1]||{x:start.x+1,y:start.y};
   ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(start.x,start.y);ctx.lineTo(end.x,end.y);ctx.stroke();
 }
 ctx.restore();
}
function reflectRay(p,v,b, maxB){
 let tMin=1e99, hit=null, type='';
 // canvas walls
 if(v.x>0){let t=(W-p.x)/v.x;if(t>1e-7&&t<tMin){tMin=t;hit='right';}}
 if(v.x<0){let t=(0-p.x)/v.x;if(t>1e-7&&t<tMin){tMin=t;hit='left';}}
 if(v.y>0){let t=(H-p.y)/v.y;if(t>1e-7&&t<tMin){tMin=t;hit='bottom';}}
 if(v.y<0){let t=(0-p.y)/v.y;if(t>1e-7&&t<tMin){tMin=t;hit='top';}}
 blocks.forEach((r,idx)=>{
   const candidates=[];
   if(v.x!==0){
     let t=(r.x-p.x)/v.x,y=p.y+t*v.y;if(t>1e-7&&y>=r.y-1e-7&&y<=r.y+r.h+1e-7)candidates.push([t,'left']);
     t=(r.x+r.w-p.x)/v.x;y=p.y+t*v.y;if(t>1e-7&&y>=r.y-1e-7&&y<=r.y+r.h+1e-7)candidates.push([t,'right']);
   }
   if(v.y!==0){
     let t=(r.y-p.y)/v.y,x=p.x+t*v.x;if(t>1e-7&&x>=r.x-1e-7&&x<=r.x+r.w+1e-7)candidates.push([t,'top']);
     t=(r.y+r.h-p.y)/v.y;x=p.x+t*v.x;if(t>1e-7&&x>=r.x-1e-7&&x<=r.x+r.w+1e-7)candidates.push([t,'bottom']);
   }
   candidates.forEach(q=>{if(q[0]<tMin){tMin=q[0];hit=q[1]}});
 });
 if(!hit)return null;
 const q={x:p.x+v.x*tMin,y:p.y+v.y*tMin};
 return {q,v:{x:(hit==='left'||hit==='right')?-v.x:v.x,y:(hit==='top'||hit==='bottom')?-v.y:v.y}};
}
function trace(p,a,n){
 let pts=[{...p}],v={x:Math.cos(a),y:Math.sin(a)},cur={...p};
 for(let i=0;i<n;i++){
   const r=reflectRay(cur,v);
   if(!r){pts.push({x:cur.x+v.x*2000,y:cur.y+v.y*2000});break}
   pts.push(r.q);cur={x:r.q.x+ r.v.x*0.01,y:r.q.y+r.v.y*0.01};v=r.v;
 }
 return pts;
}
c.addEventListener('pointerdown',e=>{
 if(!img)return;
 const p=pos(e);
 if(adding){first=first?first:null;if(!first){first=p;return}else{let x=Math.min(first.x,p.x),y=Math.min(first.y,p.y),w=Math.abs(first.x-p.x),h=Math.abs(first.y-p.y);if(w>5&&h>5)blocks.push({x,y,w,h});first=null;draw();return}}
 start=p;
 // angle from current pointer? Default upward-right
 draw();
});
let dragging=false;
c.addEventListener('pointermove',e=>{
 if(!img||adding||!start)return;
 if(e.buttons){const p=pos(e);angle=Math.atan2(p.y-start.y,p.x-start.x)*180/Math.PI;ang.value=Math.round(angle);aa.textContent=Math.round(angle)+'°';draw();}
});
bounce.oninput=()=>{bb.textContent=bounce.value;draw()};
ang.oninput=()=>{angle=Number(ang.value);aa.textContent=angle+'°';draw()};
document.getElementById('mode').onclick=()=>{
 adding=!adding; first=null;
 document.getElementById('mode').textContent=adding?'🧱 障害物追加ON':'🧱 障害物追加OFF';
};
document.getElementById('undo').onclick=()=>{blocks.pop();draw()};
document.getElementById('clear').onclick=()=>{img=null;start=null;blocks=[];file.value='';empty.style.display='flex';draw()};
document.getElementById('save').onclick=()=>{
 if(!img)return;
 const a=document.createElement('a');a.download='monst-reflection-guide.png';a.href=c.toDataURL('image/png');a.click();
};
draw();
</script>
</body>
</html>
