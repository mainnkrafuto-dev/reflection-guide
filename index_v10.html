<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>モンスト 反射線ガイド v10</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;background:#111;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif}
  header{position:sticky;top:0;z-index:5;background:#181818;padding:10px 12px;border-bottom:1px solid #333}
  h1{font-size:16px;margin:0 0 8px}
  .row{display:flex;gap:7px;flex-wrap:wrap;align-items:center}
  button,label.btn{background:#2a2a2a;color:#fff;border:1px solid #555;border-radius:9px;padding:8px 10px;font-size:13px}
  button.active{background:#1769aa;border-color:#51b5ff}
  input[type=file]{display:none}
  .control{font-size:12px;color:#ddd}
  input[type=range]{width:120px;vertical-align:middle}
  #wrap{display:flex;justify-content:center;padding:10px;background:#080808}
  canvas{display:block;max-width:100%;height:auto;background:#222;touch-action:none}
  #info{padding:8px 12px;color:#bbb;font-size:12px;line-height:1.5;background:#151515}
  .badge{display:inline-block;padding:2px 6px;border-radius:6px;background:#333;margin-right:4px}
</style>
</head>
<body>
<header>
  <h1>モンスト 反射線ガイド v10 — 壁座標固定版</h1>
  <div class="row">
    <label class="btn">スクショ読込<input id="file" type="file" accept="image/*"></label>
    <button id="lock">① 円を合わせる</button>
    <button id="showWall">壁枠 ON</button>
    <button id="save">画像保存</button>
  </div>
  <div class="row" style="margin-top:7px">
    <span class="control">反射 <input id="bounces" type="range" min="0" max="20" value="8"><b id="bv">8</b>回</span>
    <span class="control">円径 <input id="diam" type="range" min="40" max="160" value="110"><b id="dv">110</b>px</span>
    <span class="control">線長 <input id="len" type="range" min="1000" max="20000" value="12000"><b id="lv">12000</b>px</span>
  </div>
</header>

<div id="wrap"><canvas id="cv"></canvas></div>
<div id="info">
  <span class="badge">固定壁</span>
  710×1536基準：左36 / 右676 / 上296 / 下1036
  <br>
  スクショを読み込んだら、指より約90px上に表示される円をキャラに合わせる → 「位置固定」で線を表示。固定後は画面のどこを最初にタップしても、その点を「擬似的なキャラ中心」として360°の角度調整ができます。進行方向の反対側は黄色の実線で表示します。
  壁合わせ操作はありません。
</div>

<script>
const BASE_W=710, BASE_H=1536;
// 今回の2枚の実測：壁に接触した「六角形中心」を中心座標として固定。
// 左下：左壁≈36, 下壁≈1036 / 右上：右壁≈676, 上壁≈296
const WALL={L:36,R:676,T:296,B:1036};

const cv=document.getElementById('cv'), ctx=cv.getContext('2d');
const file=document.getElementById('file');
const lockBtn=document.getElementById('lock');
const place=document.getElementById('lock');
const showWall=document.getElementById('showWall');
const save=document.getElementById('save');
const bounces=document.getElementById('bounces');
const diam=document.getElementById('diam');
const len=document.getElementById('len');
const bv=document.getElementById('bv'),dv=document.getElementById('dv'),lv=document.getElementById('lv');

let img=null, W=BASE_W,H=BASE_H;
let sx=1,sy=1;
let ball={x:355,y:700,r:38};
let aim={x:500,y:700};
let pullPoint={x:155,y:700};
// 引っ張り操作用の「擬似キャラ中心」。最初に画面をタップした点を固定し、
// その点を中心に指を動かした角度を、実キャラの発射角として使う。
let aimAnchor={x:155,y:700};
let dragging=null;
let showWalls=true;
let locked=false;
let touchPreview=null;
const TOUCH_OFFSET_CSS=126;
function getTouchOffsetY(){
  const r=cv.getBoundingClientRect();
  return TOUCH_OFFSET_CSS*BASE_H/r.height;
}

function fitCanvas(){
  const maxW=Math.min(window.innerWidth-20,BASE_W);
  const ratio=BASE_H/BASE_W;
  cv.style.width=maxW+'px';
  cv.style.height=(maxW*ratio)+'px';
  sx=cv.width/BASE_W; sy=cv.height/BASE_H;
}

function resizeCanvas(){
  cv.width=BASE_W; cv.height=BASE_H; fitCanvas(); draw();
}
window.addEventListener('resize',fitCanvas);

function draw(){
  ctx.clearRect(0,0,W,H);
  if(img){
    ctx.drawImage(img,0,0,W,H);
  }else{
    ctx.fillStyle='#251f1b';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#777';ctx.font='24px sans-serif';ctx.textAlign='center';
    ctx.fillText('スクリーンショットを読み込んでください',W/2,H/2);
  }

  if(showWalls){
    ctx.save();
    ctx.strokeStyle='rgba(0,220,255,.9)';
    ctx.lineWidth=3;
    ctx.setLineDash([12,8]);
    ctx.strokeRect(WALL.L,WALL.T,WALL.R-WALL.L,WALL.B-WALL.T);
    ctx.setLineDash([]);
    ctx.fillStyle='rgba(0,220,255,.95)';
    ctx.font='bold 18px sans-serif';
    ctx.textAlign='left';
    ctx.fillText('固定壁',WALL.L+8,WALL.T-10);
    ctx.restore();
  }

  if(locked) drawGuide();
  if(!locked) drawPlacementUI();
}

function drawPlacementUI(){
  ctx.save();
  ctx.strokeStyle='#ff315d'; ctx.lineWidth=4;
  ctx.fillStyle='rgba(255,49,93,.10)';
  ctx.beginPath(); ctx.arc(ball.x,ball.y,ball.r,0,Math.PI*2); ctx.fill(); ctx.stroke();
  ctx.fillStyle='#ff315d';
  ctx.beginPath(); ctx.arc(ball.x,ball.y,4,0,Math.PI*2); ctx.fill();

  if(touchPreview){
    ctx.strokeStyle='rgba(255,255,255,.75)';
    ctx.lineWidth=2; ctx.setLineDash([5,5]);
    ctx.beginPath(); ctx.moveTo(touchPreview.x,touchPreview.y); ctx.lineTo(ball.x,ball.y); ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle='rgba(255,255,255,.9)';
    ctx.beginPath(); ctx.arc(touchPreview.x,touchPreview.y,6,0,Math.PI*2); ctx.fill();
  }
  ctx.restore();
}

function drawGuide(){
  // 固定後は画面のどこからでも指を置いて引っ張れる。
  // 指の位置（pullPoint）を基準に、反対方向を進行方向にする。
  // 軌道
  const p=trace(ball.x,ball.y,aim.x,aim.y,Number(bounces.value),Number(len.value));
  ctx.save();
  ctx.strokeStyle='rgba(255,70,70,.95)';
  ctx.lineWidth=5;
  ctx.lineCap='round';
  ctx.shadowColor='rgba(0,0,0,.7)';
  ctx.shadowBlur=4;
  ctx.beginPath();
  ctx.moveTo(p[0].x,p[0].y);
  for(let i=1;i<p.length;i++)ctx.lineTo(p[i].x,p[i].y);
  ctx.stroke();
  ctx.restore();

  // 反射点
  ctx.fillStyle='#fff';
  for(let i=1;i<p.length-1;i++){
    ctx.beginPath();ctx.arc(p[i].x,p[i].y,5,0,Math.PI*2);ctx.fill();
  }

  // キャラ円
  ctx.save();
  ctx.strokeStyle='#ff315d';ctx.lineWidth=4;
  ctx.fillStyle='rgba(255,49,93,.10)';
  ctx.beginPath();ctx.arc(ball.x,ball.y,ball.r,0,Math.PI*2);ctx.fill();ctx.stroke();
  ctx.fillStyle='#ff315d';
  ctx.beginPath();ctx.arc(ball.x,ball.y,4,0,Math.PI*2);ctx.fill();
  ctx.restore();

  // モンスト式の感覚：最初にタップした「擬似キャラ中心」を固定し、
  // そこから指を引っ張った方向の逆を進行方向にする。
  const dx=aim.x-ball.x,dy=aim.y-ball.y;
  const d=Math.hypot(dx,dy)||1;
  const ux=dx/d,uy=dy/d;

  // 進行方向の反対側も、最初の壁まで黄色の実線で表示
  const back=firstWallHit(ball.x,ball.y,-ux,-uy);
  if(back){
    ctx.save();
    ctx.strokeStyle='#ffe45c';ctx.lineWidth=4;ctx.lineCap='round';
    ctx.beginPath();ctx.moveTo(ball.x,ball.y);ctx.lineTo(back.x,back.y);ctx.stroke();
    ctx.restore();
  }
}

function firstWallHit(x,y,dx,dy){
  const hits=[];
  if(dx>1e-9) hits.push((WALL.R-x)/dx);
  if(dx<-1e-9) hits.push((WALL.L-x)/dx);
  if(dy>1e-9) hits.push((WALL.B-y)/dy);
  if(dy<-1e-9) hits.push((WALL.T-y)/dy);
  const t=Math.min(...hits.filter(v=>v>1e-7));
  if(!isFinite(t)) return null;
  return {x:x+dx*t,y:y+dy*t};
}

function trace(x,y,ax,ay,n,maxLen){
  let dx=ax-x,dy=ay-y,d=Math.hypot(dx,dy);
  if(d<1)return [{x,y}];
  dx/=d;dy/=d;
  let remain=maxLen, pts=[{x,y}], px=x,py=y;
  for(let b=0;b<=n && remain>0;b++){
    let tx=Infinity,ty=Infinity,hitX=null,hitY=null;
    if(dx>1e-9){tx=(WALL.R-px)/dx;hitX='R'}
    else if(dx<-1e-9){tx=(WALL.L-px)/dx;hitX='L'}
    if(dy>1e-9){ty=(WALL.B-py)/dy;hitY='B'}
    else if(dy<-1e-9){ty=(WALL.T-py)/dy;hitY='T'}

    let t=Infinity;
    if(tx>1e-7)t=Math.min(t,tx);
    if(ty>1e-7)t=Math.min(t,ty);

    if(!isFinite(t) || t>=remain){
      pts.push({x:px+dx*remain,y:py+dy*remain});
      break;
    }
    px+=dx*t;py+=dy*t;remain-=t;
    pts.push({x:px,y:py});

    const eps=1e-7;
    const hitXwall=Math.abs(px-WALL.L)<1e-4||Math.abs(px-WALL.R)<1e-4;
    const hitYwall=Math.abs(py-WALL.T)<1e-4||Math.abs(py-WALL.B)<1e-4;
    if(hitXwall)dx=-dx;
    if(hitYwall)dy=-dy;
    if(!hitXwall&&!hitYwall)break;
    px+=dx*eps;py+=dy*eps;
  }
  return pts;
}

function posFromEvent(e){
  const r=cv.getBoundingClientRect();
  return {x:(e.clientX-r.left)*BASE_W/r.width,y:(e.clientY-r.top)*BASE_H/r.height};
}
function down(e){
  e.preventDefault();
  const p=posFromEvent(e);
  const d=Math.hypot(p.x-ball.x,p.y-ball.y);
  // 位置固定後は画面のどこからでも操作可能。
  // 最初にタップした点を「擬似的なキャラクター中心」として固定し、
  // そこを基準に指を360°動かして角度を決める。
  if(locked){
    dragging='aim';
    aimAnchor.x=p.x;
    aimAnchor.y=p.y;
    pullPoint.x=p.x;
    pullPoint.y=p.y;
    // 初期タップ位置とキャラ中心を結ぶ方向を暫定角度にする。
    let dx=aimAnchor.x-p.x,dy=aimAnchor.y-p.y;
    if(Math.hypot(dx,dy)<1){
      dx=ball.x-p.x; dy=ball.y-p.y;
    }
    aim.x=ball.x+dx;
    aim.y=ball.y+dy;
  }else if(d<=ball.r+25){
    dragging='ball';
  }else{
    dragging='ball';
  }
  cv.setPointerCapture?.(e.pointerId);
  move(e);
}
function move(e){
  if(!dragging)return;
  e.preventDefault();
  const p=posFromEvent(e);
  if(dragging==='ball'){
    // キャラクター中心は壁の内側ならどこでも置ける。円の半径分まで内側へ制限しない。
    ball.x=Math.max(WALL.L,Math.min(WALL.R,p.x));
    ball.y=Math.max(WALL.T,Math.min(WALL.B,p.y-getTouchOffsetY()));
    // 発射方向も同じベクトルを維持
    const dx=aim.x-ball.x,dy=aim.y-ball.y;
    if(Math.hypot(dx,dy)<5){aim.x=ball.x+100;aim.y=ball.y}
  }else{
    // 最初のタップ位置（擬似キャラ中心）から見た現在の指位置を使う。
    // 指を中心から外へ引っ張った方向の逆が進行方向。
    const dx=aimAnchor.x-p.x;
    const dy=aimAnchor.y-p.y;
    if(Math.hypot(dx,dy)>1){
      aim.x=ball.x+dx;
      aim.y=ball.y+dy;
    }
    pullPoint.x=p.x;
    pullPoint.y=p.y;
  }
  draw();
}
function up(){dragging=null}

cv.addEventListener('pointerdown',down);
cv.addEventListener('pointermove',move);
cv.addEventListener('pointerup',up);
cv.addEventListener('pointercancel',up);

file.addEventListener('change',e=>{
  const f=e.target.files?.[0];if(!f)return;
  const u=URL.createObjectURL(f), im=new Image();
  im.onload=()=>{
    img=im;
    // どんなスクショでも710x1536の基準へ座標変換。
    // 今回はユーザー提供の同一端末比率を基準にする。
    draw();URL.revokeObjectURL(u);
  };
  im.src=u;
});

place.onclick=()=>{place.classList.add('active')};
lockBtn.onclick=()=>{
  locked=!locked;
  if(locked){
    aim.x=ball.x+200; aim.y=ball.y;
    pullPoint.x=ball.x-200; pullPoint.y=ball.y;
    lockBtn.textContent='② 位置固定中（タップで解除）';
    lockBtn.classList.add('locked');
  }else{
    lockBtn.textContent='① 円を合わせる';
    lockBtn.classList.remove('locked');
  }
  draw();
};

showWall.onclick=()=>{showWalls=!showWalls;showWall.textContent='壁枠 '+(showWalls?'ON':'OFF');draw()};
bounces.oninput=()=>{bv.textContent=bounces.value;draw()};
diam.oninput=()=>{ball.r=Number(diam.value)/2;dv.textContent=diam.value;draw()};
len.oninput=()=>{lv.textContent=Number(len.value).toLocaleString();draw()};

save.onclick=()=>{
  const a=document.createElement('a');
  a.download='monst-reflection-guide-v10.png';
  a.href=cv.toDataURL('image/png');
  a.click();
};

resizeCanvas();
</script>
</body>
</html>
